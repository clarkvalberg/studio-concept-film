name: Bug report
description: Something in the skill, the scripts, or the Remotion template isn't working
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. The more concrete you can be, the faster this gets fixed.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, and what went wrong?
      placeholder: |
        I attached a brief and a Figma link, then asked Claude to make a concept film...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: If possible, the exact sequence that triggers the bug.
      placeholder: |
        1.
        2.
        3.

  - type: input
    id: phase
    attributes:
      label: Which phase
      description: If the bug occurred during the skill's workflow, which phase? (1–7)
      placeholder: "e.g. Phase 6 — Hook render"

  - type: dropdown
    id: environment
    attributes:
      label: Claude environment
      options:
        - claude.ai
        - Claude Code
        - Cowork
        - Other (specify below)
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`
      placeholder: "v18.x.x"

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 14.5 / Ubuntu 22.04 / Windows 11"

  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Paste any error messages or relevant log output. Use code blocks.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that might help.
