name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: ./scripts
          severity: warning

  hyperframes:
    name: hyperframes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assets/hyperframes-template
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: Lint HyperFrames template
        run: |
          node scripts/generate-data.mjs
          npx --yes hyperframes@0.6.46 lint

  remotion:
    name: remotion
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assets/remotion-template
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: Typecheck Remotion template
        run: |
          npm ci --silent
          npx --no-install tsc --noEmit

  markdown-link-check:
    name: link-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check Markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: "yes"
          use-verbose-mode: "no"
          config-file: ".github/markdown-link-check.json"
        continue-on-error: true

  smoke-render:
    name: smoke-render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Render silent default hook
        run: |
          project="$(mktemp -d)"
          ./scripts/init-project.sh "$project"
          ./scripts/render-design-thumbnail.sh "$project"
          test -s "$project/out/design-thumbnail.png"
          grep -q '"renderer": "remotion"' "$project/renderer.json"
          ffmpeg -y \
            -f lavfi \
            -i anullsrc=channel_layout=stereo:sample_rate=44100 \
            -t 15 \
            -q:a 9 \
            -acodec libmp3lame \
            "$project/remotion/public/audio/hook.mp3"
          ./scripts/render-hook.sh "$project"
          test -s "$project/out/hook.mp4"
          test -s "$project/out/cover-frame.png"
          ./scripts/check-static-video.sh "$project/out/hook.mp4"
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 "$project/out/hook.mp4" | grep -q '^audio$'

      - name: HyperFrames scaffold smoke
        run: |
          project="$(mktemp -d)"
          ./scripts/init-project.sh "$project" --renderer hyperframes
          test -f "$project/renderer.json"
          grep -q '"renderer": "hyperframes"' "$project/renderer.json"
          test -f "$project/hyperframes/data/film.json"
          test -f "$project/hyperframes/data/tokens.json"
          ./scripts/render-design-thumbnail.sh "$project"
          test -s "$project/out/design-thumbnail.png"
